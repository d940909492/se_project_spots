<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="idk for now" />
    <meta name="ZhuoDong Zhen" content="spots" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__content">
          <section class="profile__avatar-section">
            <div class="profile__avatar-container">
              <button class="profile__avatar-btn">
                <img
                  src="<%=require('./images/pencil_w.png')%>"
                  alt="Edit profile avatar"
                  class="profile__avatar-edit-icon"
                />
              </button>
              <img
                src="<%=require('./images/unknown.png')%>"
                alt="Profile photo of Bessie Coleman"
                class="profile__avatar"
              />
            </div>
            <div class="profile__column">
              <div class="profile__column-content">
                <h1 class="profile__name">Loading User Name...</h1>
                <p class="profile__description">Loading User description...</p>
              </div>
              <button class="profile__button-secondary">
                <img
                  src="<%=require('./images/pencil.svg')%>"
                  alt="Edit profile"
                  class="profile__edit-icon"
                />
                Edit Profile
              </button>
            </div>
          </section>

          <button class="profile__button-large">
            <img
              src="<%=require('./images/plus.svg')%>"
              alt="plus icon"
              class="profile__new-post-icon"
            />
            New Post
          </button>
        </section>

        <section class="cards page__content">
          <div class="no-cards">
            <p class="no-cards__text">No Post yet, please add some Post</p>
          </div>
          <ul class="cards__list">
            <!-- sprint 6 -->
            <!-- <template> element, it have the same elements and classes as the existing card elements -->
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__text"></h2>
                  <button class="card__like-button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__content">
        <p class="footer__text">2023 © Spots</p>
      </footer>

      <!-- new-post-modal and edit-profile-modal -->
      <!-- edit profile modal -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <div class="modal__head">
            <h2 class="modal__title">Edit profile</h2>
            <button class="modal__close-button"></button>
          </div>

          <form class="modal__form" novalidate>
            <div class="modal__form-group">
              <label for="modal-profile-name" class="modal__label">Name</label>
              <input
                type="text"
                id="modal-profile-name"
                placeholder="Type your name"
                class="modal__input"
                minlength="2"
                maxlength="40"
                required
              />
              <span class="modal__input-error modal-profile-name-error"></span>
            </div>

            <div class="modal__form-group">
              <label for="modal-profile-description" class="modal__label"
                >Description</label
              >
              <input
                type="text"
                id="modal-profile-description"
                placeholder="Describe yourself"
                class="modal__input"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                class="modal__input-error modal-profile-description-error"
              ></span>
            </div>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- new  post modal -->
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <div class="modal__head">
            <h2 class="modal__title">New Post</h2>
            <button class="modal__close-button"></button>
          </div>

          <form class="modal__form" novalidate>
            <div class="modal__form-group">
              <label for="modal-image-link" class="modal__label"
                >Image link</label
              >
              <input
                type="url"
                id="modal-image-link"
                placeholder="Paste a link to the picture"
                class="modal__input"
                required
              />
              <span class="modal__input-error modal-image-link-error"></span>
            </div>

            <div class="modal__form-group">
              <label for="modal-caption-texts" class="modal__label"
                >Caption</label
              >
              <input
                type="text"
                id="modal-caption-texts"
                placeholder="Type your caption"
                class="modal__input"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="modal__input-error modal-caption-texts-error"></span>
            </div>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
      <!-- end of new-post-modal and edit-profile-modal -->

      <!-- The preview image modal -->
      <div class="modal modal_type_preview" id="preview-image-modal">
        <div class="modal__preview-container">
          <button class="modal__close-button_type_preview"></button>
          <img
            class="modal__image"
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
            alt=""
          />
          <p class="modal__caption"></p>
        </div>
      </div>

      <!-- The modal for updating the profile picture -->
      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <div class="modal__head">
            <h2 class="modal__title">Edit profile avatar</h2>
            <button class="modal__close-button"></button>
          </div>

          <form class="modal__form" novalidate>
            <div class="modal__form-group">
              <label for="modal-avatar-link" class="modal__label"
                >Profile Picture</label
              >
              <input
                type="url"
                id="modal-avatar-link"
                placeholder="Paste the link to an image"
                class="modal__input"
                required
              />
              <span class="modal__input-error modal-avatar-link-error"></span>
            </div>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- Creating a popup for deleting a card -->
      <div class="modal" id="popup-modal">
        <div class="modal__container modal__popup-container">
          <button class="modal__close-button_type_preview"></button>
          <div class="modal__head modal__head-popup">
            <h2 class="modal__title modal__title-popup">
              Are you sure you want to delete this image?
            </h2>
          </div>

          <form class="modal__form modal__form-popup" novalidate>
            <button
              type="submit"
              class="modal__save-button modal__delete-button"
            >
              Delete
            </button>
            <button type="button" class="modal__cancel-button">Cancel</button>
          </form>
        </div>
      </div>
      <!------------------------------------------------------------------------------------>
    </div>
  </body>
</html>
