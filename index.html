<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="idk for now" />
    <meta name="ZhuoDong Zhen" content="spots" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/logo.svg" alt="spots__logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__content">
          <section class="profile__avatar-section">
            <img
              src="./images/avatar.jpg"
              alt="profile__avator"
              class="profile__avatar"
            />
            <div class="profile__column">
              <div class="profile__column-content">
                <h1 class="profile__name">Bessie Coleman</h1>
                <p class="profile__description">Civil Aviator</p>
              </div>
              <button class="profile__button-secondary">
                <img
                  src="./images/pencil.svg"
                  alt="icon__pencil"
                  class="profile__edit-icon"
                />
                Edit Profile
              </button>
            </div>
          </section>

          <button class="profile__button-large">
            <img
              src="./images/plus.svg"
              alt="plus icon"
              class="profile__new-post-icon"
            />
            New Post
          </button>
        </section>

        <section class="cards page__content">
          <ul class="cards__list">
            <li class="card">
              <img
                src="./images/1-photo-by-moritz-feldmann-from-pexels.jpg"
                alt="Val Thorens image"
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__text">Val Thorens</h2>
                <button class="card__like-button"></button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/2-photo-by-ceiline-from-pexels.jpg"
                alt="Restaurant terrace image"
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__text">Restaurant terrace</h2>
                <button class="card__like-button"></button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/3-photo-by-tubanur-dogan-from-pexels.jpg"
                alt="An outdoor cafe image"
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__text">An outdoor cafe</h2>
                <button class="card__like-button"></button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/4-photo-by-maurice-laschet-from-pexels.jpg"
                alt="A very long bridge, over the forest... image"
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__text">
                  A very long bridge, over the forest...
                </h2>
                <button class="card__like-button"></button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/5-photo-by-van-anh-nguyen-from-pexels.jpg"
                alt="Tunnel with morning light image"
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__text">Tunnel with morning light</h2>
                <button class="card__like-button"></button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/6-photo-by-moritz-feldmann-from-pexels.jpg"
                alt="Mountain house image"
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__text">Mountain house</h2>
                <button class="card__like-button"></button>
              </div>
            </li>
          </ul>
        </section>
      </main>
      <footer class="footer page__content">
        <p class="footer__text">2023 © Spots</p>
      </footer>

      <!-- sprint 4 -->
      <!-- new-post-modal and edit-profile-modal -->
      <!-- edit profile -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <div class="modal__head">
            <h2 class="modal__title">Edit profile</h2>
            <button class="modal__close-button"></button>
          </div>

          <form class="modal__form">
            <div class="modal__form-group">
              <label for="modal-profile-name" class="modal__label">Name</label>
              <input
                type="text"
                id="modal-profile-name"
                placeholder="Type your name"
                class="modal__input"
              />
            </div>

            <div class="modal__form-group">
              <label for="modal-profile-description" class="modal__label"
                >Description</label
              >
              <input
                type="text"
                id="modal-profile-description"
                placeholder="Describe yourself"
                class="modal__input"
              />
            </div>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- new  post -->
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <div class="modal__head">
            <h2 class="modal__title">New Post</h2>
            <button class="modal__close-button"></button>
          </div>

          <form class="modal__form">
            <div class="modal__form-group">
              <label for="modal-image-link" class="modal__label"
                >Image link</label
              >
              <input
                type="url"
                id="modal-image-link"
                placeholder="Paste a link to the picture"
                class="modal__input"
              />
            </div>

            <div class="modal__form-group">
              <label for="modal-caption-texts" class="modal__label"
                >Caption</label
              >
              <input
                type="text"
                id="modal-caption-texts"
                placeholder="Type your caption"
                class="modal__input"
              />
            </div>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
